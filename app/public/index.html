<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Someday</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Someday</h1>
    <p class="tagline">Things you've saved for later</p>
    <button id="add" type="button">+ Add Screenshots</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <p id="status" role="status"></p>
    <input id="q" type="search" placeholder="Search text, names, places…" autocomplete="off">
    <nav id="chips" aria-label="Filter by intent"></nav>
  </header>
  <main>
    <p id="empty" hidden>Nothing here yet.</p>
    <div id="grid"></div>
  </main>
  <div id="drop" hidden>Drop screenshots to add them</div>
  <dialog id="detail">
    <img id="detail-img" alt="">
    <p id="detail-meta"></p>
    <form id="edit">
      <label>Name <input name="name"></label>
      <label>Location <input name="location"></label>
      <label>Type <select name="type"></select></label>
      <label>Saved to <select name="intent"></select></label>
      <label>Why saved <input name="why_saved"></label>
      <label>Useful details (one per line) <textarea name="useful_details" rows="4"></textarea></label>
      <p id="confidence"></p>
      <div class="row"><button type="submit">Save changes</button><button id="reprocess" type="button">Re-process</button></div>
    </form>
    <h2>Text found in screenshot</h2>
    <pre id="detail-text"></pre>
    <button id="reocr" type="button">Re-run OCR</button>
    <form method="dialog">
      <button id="delete" type="button" class="danger">Delete from Someday</button>
      <button>Close</button>
    </form>
    <p class="note">Only Someday's copy is deleted. Your original stays untouched.</p>
  </dialog>
  <script src="app.js" type="module"></script>
</body>
</html>
